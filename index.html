<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네모여 — 곧 열려요</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #F6F5FF; --fg: #1E1B3A; --sub: #5d5a73; --brand: #5B4CF5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14122A; --fg: #EDEBFF; --sub: #b3afd1; --brand: #8D82FF; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  h1 { color: var(--brand); font-size: 34px; margin: 0 0 10px; letter-spacing: -0.5px; }
  p { margin: 4px 0; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>동네모여</h1>
  <p>찾지 마세요, 모임이 찾아옵니다.</p>
  <p>체험 페이지를 준비하고 있어요.</p>
</main>
</body>
</html>
