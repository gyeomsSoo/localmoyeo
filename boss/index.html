<!doctype html>
<html lang="ko" data-root="../" data-page="boss">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>인터뷰 시트</title>
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 글꼴은 그리기를 막지 않게 늦게 붙인다: 먼저 시스템 한글 글꼴로 보이고, 받아지면 Pretendard 로 바뀐다 -->
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/boss.css">
<script src="../js/core.js" defer></script>
<script src="../js/fields.js" defer></script>
<script src="../js/trial.js" defer></script>
<script src="../js/boss.js" defer></script>
</head>
<body>
<!-- 어디서도 링크하지 않는다. 검색에도 안 뜨게 noindex. -->
<div class="hp" aria-hidden="true"><label>이 칸은 비워 두세요 <input id="hp" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>

<header class="bz-top">
  <div class="bz-bar">
    <button type="button" class="bz-drafts" id="draftsBtn" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span class="bz-name" id="draftName">새 가게</span>
      <span class="bz-dcount num" id="draftCount"></span>
    </button>
    <button type="button" class="btn small line" id="demoBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
      시연
    </button>
  </div>
  <p class="bz-status" id="status" role="status" aria-live="polite"></p>
  <nav class="bz-nav" id="secNav" aria-label="구간 바로가기"></nav>
</header>

<main class="bz-main" id="main">
  <div class="bz-loading" id="loading"><div class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p>시트를 불러오고 있어요</p></div>
</main>

<div class="bz-sheet-back" id="sheetBack" hidden></div>
<section class="bz-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="bz-sheet-head">
    <h2 id="sheetTitle">가게 목록</h2>
    <button type="button" class="btn ghost small" id="sheetClose">닫기</button>
  </div>
  <p class="bz-sheet-sub">이 기기에만 저장돼요. 보낸 뒤에도 고쳐서 다시 보낼 수 있어요(시트에 새 줄로 쌓여요).</p>
  <button type="button" class="btn primary block" id="newDraft">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    새 가게 시작
  </button>
  <ul class="bz-list" id="draftList"></ul>
</section>
</body>
</html>
